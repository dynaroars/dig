name: Validate Prime deployment

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'web/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prime installer syntax
        run: bash -n web/install-prime.sh

      - name: Compile backend Python
        run: python -m py_compile web/server.py web/docker_runner.py

      - name: Confirm frontend uses the same-origin API
        run: |
          grep -Fq 'var API_BASE = "";' web/index.html
          grep -Fq 'var API_BASE = "";' web/symexc.html
