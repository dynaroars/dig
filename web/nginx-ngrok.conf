# Nginx configuration for DIG on a dedicated ngrok domain
server {
    listen 80;
    listen [::]:80;
    
    server_name density-capillary-thinning.ngrok-free.dev;

    # DIG Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for long-running verification jobs
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100M;
    }

    # DIG Frontend static assets served at root
    location / {
        alias /home/azan/dig-dev/web/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
