# DIG Nginx Reverse Proxy Configuration Snippet (for roars.dev/dig)
# Include or paste this into your existing Nginx server block for roars.dev

location /dig/ {
    alias /home/azan/dig-dev/web/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /dig/index.html;

    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

location /dig/api/ {
    proxy_pass http://127.0.0.1:5001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
