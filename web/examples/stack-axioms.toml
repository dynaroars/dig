mutates = [0]

[[operations]]
id = "pop"
binding = "axioms.fixtures:Stack.pop"
kind = "instance_method"
receiver_type = "stack"
parameter_types = []
return_type = "item"
mutates = [0]

[[operations]]
id = "peek"
binding = "axioms.fixtures:Stack.peek"
kind = "instance_method"
receiver_type = "stack"
parameter_types = []
return_type = "item"
